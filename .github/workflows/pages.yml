name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs to write the deployment; the checkout only needs to read.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        # Served from https://<user>.github.io/Flashy/, so everything Next emits
        # needs that prefix. See next.config.ts.
        env:
          PAGES_BASE_PATH: /Flashy
        run: npm run build

      # Without this, Pages runs the output through Jekyll, which skips
      # directories beginning with an underscore. That would drop _next/ whole:
      # the page loads and not one script or stylesheet does.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
